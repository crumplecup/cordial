[package]
name = "cordial_cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/crumplecup/cordial"
authors = ["Erik Rose <erik.w.rose@gmail.com>"]
description = "CLI for cordial — polite standards for code development"
publish = false

[[bin]]
name = "cordial"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
cordial = { path = "..", default-features = false }
cordial_elicitation = { path = "../cordial_elicitation", optional = true }
derive_more = { version = "2", features = ["display"] }
miette = { version = "7", features = ["fancy"] }

[features]
default = ["quality", "elicitation"]
quality = ["cordial/quality"]
elicitation = ["cordial/elicitation", "dep:cordial_elicitation"]
homecoming_std = ["cordial/homecoming_std"]
amenable_std = ["cordial/amenable_std"]
full = ["quality", "elicitation", "homecoming_std", "amenable_std"]

[dev-dependencies]
tempfile = "3"

[[test]]
name = "cli"
required-features = ["quality"]
