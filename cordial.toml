# Canonical etiquette thresholds.
#
# Load order (later wins): CordialConfig::default, then
# `{store_home}/cordial.toml` (`~/.cordial` unless `CORDIAL_HOME` /
# `--store-home` says otherwise), then `{workspace}/cordial.toml`.
# Missing files fall back to Default; the run does not fail.
# Etiquette tables accept `enabled` (default true). `enabled = false` skips
# that etiquette for the project (`cordial explain` names this line).

# How much memory a run may use before it stops itself, saying where it was: a size
# (`12G`, `512M`), a share of the memory available when it starts (`75%`, the default),
# or `0` for none. `--memory-limit` and `CORDIAL_MEMORY_LIMIT` win over this.
memory_limit = "75%"

# Relative paths are resolved inside this project's Cordial store.
[hotpath]
output_path = "hotpath.json"

# Named test sets for `cordial perf tests timing <name>`: nextest filtersets.
[perf.tests.perf]
filter = "binary(perf_record)"

# Every test: the overview run. Serialized it takes hours; --threads trades
# exactness for time.
# The cfg context tests: small, and they exercise the context copy, priming and
# the query reuse that a profile reports.
[perf.tests.context]
filter = "binary(context_crates)"

[perf.tests.all]
filter = "all()"

# Cordial on cordial: `cordial perf workflow cordial` runs the pipeline cold,
# warm, and after one comment line is added to the file below (then restored).
[perf.workflows.cordial]
edit = "src/perf/spread.rs"

# The same on amenable: `cordial perf workflow amenable --project <amenable>`.
[perf.workflows.amenable]
edit = "crates/amenable/src/paths.rs"

[perf.tests.verus]
filter = "binary(verus_ir) | binary(panics_verus) | binary(verus_identity) | binary(proof_patterns_etiquette) | binary(verus_warnings_etiquette)"

[internal_error_chain]
# Flag every literal call site that feeds one Kind variant or native source.
kind_fanout_max_call_sites = 0

[visibility]
max_crate_names_for_flat = 50
min_module_names = 10
prefer_root = true

[modularity]
file_inventory_min_lines = 500
function_inventory_min_lines = 150
function_hotspot_min_lines = 80
file_checklist_min_lines = 500
function_checklist_min_lines = 200
max_types_per_file = 10
module_size_sigma = 2
module_size_ignore_lower_tail = false
min_module_lines = 0
top_heavy_min_percent = 50
lopsided_min_percent = 75
hierarchy_min_lines = 150

[cfg_scatter]
min_distinct_kinds = 2
min_occurrences = 5

[antipatterns.static_refs]
strategy = "cow"

# Third-party coverage targets. `derive_cap` bounds the instantiation rows
# derived from rustdoc for one generic type; `alias_depth` and
# `max_type_nodes` bound type resolution. Per target: `resolve_crates`,
# `instantiations` (see docs/planning/amenable-ext-generic-instantiations.md).
[amenable_ext]
derive_cap = 16
alias_depth = 8
max_type_nodes = 64

# The expensive feature powerset runs in the deep tier.
[feature_warnings]
depth = 2
# A gate naming more features than this is too wide to read; the checklist
# then advises a private (`_`-prefixed) feature that each of them enables.
private_feature_threshold = 6
exclude_features = ["quick", "full", "quality", "elicitation", "hotpath"]
group_features = [
    ["allows", "modularity", "derives", "cfg_scatter", "visibility", "cli_layout", "doc_warnings", "feature_warnings", "glob_imports", "inline_tests", "pageantry", "verus_warnings", "creusot_diagnostics"],
    ["error_sites", "error_chain", "internal_error_chain", "foreign_error_types", "foreign_error_attenuation"],
    ["rustdoc", "impl_coverage", "trenchcoat", "shadow", "homecoming_std", "amenable_std", "amenable_ext"],
]
