# Canonical etiquette thresholds.
#
# Load order (later wins): CordialConfig::default, then
# `{store_home}/cordial.toml` (`~/.cordial` unless `CORDIAL_HOME` /
# `--store-home` says otherwise), then `{workspace}/cordial.toml`.
# Missing files fall back to Default; the run does not fail.
# Every table accepts `enabled` (default true). `enabled = false` skips
# that etiquette for the project (`cordial explain` names this line).

[visibility]
max_crate_names_for_flat = 50
min_module_names = 10
prefer_root = true

[modularity]
file_inventory_min_lines = 500
function_inventory_min_lines = 150
function_hotspot_min_lines = 80
file_checklist_min_lines = 500
function_checklist_min_lines = 200
max_types_per_file = 10
module_size_sigma = 2
module_size_ignore_lower_tail = false
min_module_lines = 0
top_heavy_min_percent = 50
lopsided_min_percent = 75
hierarchy_min_lines = 150

[cfg_scatter]
min_distinct_kinds = 2
min_occurrences = 5

[antipatterns.static_refs]
strategy = "cow"

# Third-party coverage targets. `derive_cap` bounds the instantiation rows
# derived from rustdoc for one generic type; `alias_depth` and
# `max_type_nodes` bound type resolution. Per target: `resolve_crates`,
# `instantiations` (see docs/planning/amenable-ext-generic-instantiations.md).
[amenable_ext]
derive_cap = 16
alias_depth = 8
max_type_nodes = 64

# Warnings that fire only under some feature combinations. Mirrors the
# `check-features` recipe in the justfile (keep the two in step).
[feature_warnings]
enabled = true
depth = 2
# A gate naming more features than this is too wide to read; the checklist
# then advises a private (`_`-prefixed) feature that each of them enables.
private_feature_threshold = 6
exclude_features = ["slow_tests", "full", "quality", "elicitation"]
group_features = [
    ["allows", "modularity", "derives", "cfg_scatter", "visibility", "cli_layout", "doc_warnings", "feature_warnings", "glob_imports", "inline_tests", "pageantry", "verus_warnings", "creusot_diagnostics"],
    ["error_sites", "error_chain", "internal_error_chain", "foreign_error_types", "foreign_error_attenuation"],
    ["rustdoc", "impl_coverage", "trenchcoat", "shadow", "homecoming_std", "amenable_std", "amenable_ext"],
]
