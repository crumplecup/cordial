[package]
name = "cordial"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/crumplecup/cordial"
authors = ["Erik Rose <erik.w.rose@gmail.com>"]
homepage = "https://github.com/crumplecup/cordial"
documentation = "https://docs.rs/cordial"
readme = "README.md"
description = "Polite standards for code development — a plugin framework for local, regeneratable lint and coverage reports"
keywords = ["lint", "static-analysis", "rustdoc", "syn", "development-tools"]
categories = ["development-tools"]

[lib]
name = "cordial"
path = "src/lib.rs"

[[bin]]
name = "cordial"
path = "src/main.rs"
required-features = ["cli"]

[[example]]
name = "custom_plugins"
required-features = ["quality", "impl_coverage"]

[dependencies]
config = { version = "0.15", default-features = false, features = ["toml"] }
derive_more = { version = "2", features = ["display", "error", "from"] }
petgraph = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
verus_syn = { version = "0.0.0-2026-08-02-0125", features = ["visit", "extra-traits"], optional = true }
proc-macro2 = { version = "1", features = ["span-locations"] }
tracing = "0.1"
rustdoc-types = { version = "0.57", optional = true }
nom = { version = "7", optional = true }
walkdir = "2"
cargo_metadata = "0.23"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = { version = "0.8", optional = true }
quote = { version = "1", optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
miette = { version = "7", features = ["fancy"], optional = true }
derive-new = "0.7.0"
derive-getters = "0.5.0"

[features]
default = ["quality", "cli"]
# Quality plugins (syn scans of source).
panics = []
tracing = []
cli = ["dep:clap", "dep:miette", "tracing"]
allows = []
modularity = []
derives = []
error_sites = []
error_chain = ["error_sites"]
internal_error_chain = ["error_chain"]
foreign_error_types = ["error_sites"]
foreign_error_attenuation = ["foreign_error_types", "error_chain"]
antipatterns = ["dep:toml", "dep:quote"]
cfg_scatter = []
cfg_hygiene = ["dep:toml"]
visibility = []
cli_layout = []
crate_attrs = ["dep:toml"]
doc_warnings = []
glob_imports = []
inline_tests = []
verus_warnings = []
# Real verus_syn-based parsing of verus! { .. } blocks into first-class
# Verus AST facts (mode, publish, requires/ensures/decreases, assume/
# admit/external_body usage) -- foundational infrastructure other
# etiquettes (panics, proof_patterns) build on.
verus_ir = ["dep:verus_syn", "dep:quote"]
# Soundness/proof-visibility signals inside verus! { .. } blocks: assume,
# admit, external_body, uninterp, axiom (VerusFnFacts::
# is_trusted_not_proven()), and broadcast. The real consumer verus_ir was
# built for.
proof_patterns = ["verus_ir"]
pageantry = []
quality = ["panics", "tracing", "derives", "allows", "modularity", "error_sites", "error_chain", "internal_error_chain", "foreign_error_types", "foreign_error_attenuation", "antipatterns", "cfg_scatter", "cfg_hygiene", "visibility", "cli_layout", "crate_attrs", "doc_warnings", "glob_imports", "inline_tests", "verus_warnings", "proof_patterns", "pageantry"]
# Shared rustdoc JSON support for coverage plugins.
rustdoc = ["dep:rustdoc-types", "dep:nom"]
# Elicitation coverage plugins (each requires rustdoc).
impl_coverage = ["rustdoc"]
trenchcoat = ["rustdoc"]
shadow = ["rustdoc"]
# Framework std coverage (homecoming Code, amenable registry).
homecoming_std = ["rustdoc"]
amenable_std = ["homecoming_std"]
# Umbrella: all elicitation coverage plugins.
elicitation = ["impl_coverage", "trenchcoat", "shadow"]
# Every built-in plugin (integration tests, full builds).
full = ["quality", "elicitation", "homecoming_std", "amenable_std", "cli", "verus_ir"]
# Opt-in gate for tests too expensive/environment-dependent for routine
# `cargo test`/`cargo test --features full` runs -- deliberately NOT
# part of `full` (or any other bundle), so it's off by default even
# under a broad feature set. `--all-features` still enables it, same as
# every other feature; that's inherent to what --all-features means, not
# something a feature declaration can opt out of -- routine verification
# should use `--features full` instead, reserving `--all-features` for a
# deliberate, occasional full pass. See `just test-slow`.
slow_tests = []

[[test]]
name = "custom_plugins"
required-features = ["quality", "impl_coverage"]

[[test]]
name = "cli"
required-features = ["cli", "quality"]

[[test]]
name = "explain"
required-features = ["quality"]

[[test]]
name = "stability"
required-features = ["rustdoc"]

[[test]]
name = "framework_std"
required-features = ["homecoming_std"]

[[test]]
name = "sysroot_cache"
required-features = ["homecoming_std"]

[[test]]
name = "amenable_registry"
required-features = ["amenable_std"]

[[test]]
name = "coverage_etiquette"
required-features = ["elicitation"]

[[test]]
name = "build_stage"
required-features = ["elicitation"]

[[test]]
name = "panics_etiquette"
required-features = ["panics"]

[[test]]
name = "tracing_etiquette"
required-features = ["tracing"]

[[test]]
name = "tracing_apply"
required-features = ["tracing"]

[[test]]
name = "tracing_subscriber"
required-features = ["tracing"]

[[test]]
name = "tracing_print"
required-features = ["tracing"]

[[test]]
name = "allows_etiquette"
required-features = ["allows"]

[[test]]
name = "modularity_etiquette"
required-features = ["modularity"]

[[test]]
name = "cfg_scatter_etiquette"
required-features = ["cfg_scatter"]

[[test]]
name = "cfg_hygiene_etiquette"
required-features = ["cfg_hygiene"]

[[test]]
name = "visibility_etiquette"
required-features = ["visibility"]

[[test]]
name = "cli_layout_etiquette"
required-features = ["cli_layout"]

[[test]]
name = "crate_attrs_etiquette"
required-features = ["crate_attrs"]

[[test]]
name = "doc_warnings_etiquette"
required-features = ["doc_warnings"]

[[test]]
name = "glob_imports_etiquette"
required-features = ["glob_imports"]

[[test]]
name = "inline_tests_etiquette"
required-features = ["inline_tests"]

[[test]]
name = "verus_warnings_etiquette"
required-features = ["verus_warnings"]

[[test]]
name = "proof_patterns_etiquette"
required-features = ["proof_patterns"]

[[test]]
name = "pageantry_etiquette"
required-features = ["pageantry"]

[[test]]
name = "derives_etiquette"
required-features = ["derives"]

[[test]]
name = "error_sites_etiquette"
required-features = ["error_sites"]

[[test]]
name = "error_flow"
required-features = ["error_sites"]

[[test]]
name = "error_chain_etiquette"
required-features = ["error_chain"]

[[test]]
name = "internal_error_chain_etiquette"
required-features = ["internal_error_chain"]

[[test]]
name = "foreign_error_types_etiquette"
required-features = ["foreign_error_types"]

[[test]]
name = "foreign_error_attenuation_etiquette"
required-features = ["foreign_error_attenuation"]

[[test]]
name = "antipatterns_etiquette"
required-features = ["antipatterns"]

[[test]]
