[[test]]
name = "exceptions"
required-features = ["panics"]

[[test]]
name = "quality_report"
required-features = ["quality"]

[[test]]
name = "rollup"
required-features = ["quality"]

[[test]]
name = "workspace"
required-features = ["panics"]

[[test]]
name = "coverage_summary"
required-features = ["homecoming_std"]

[[test]]
name = "elicitation_coverage_summary"
required-features = ["elicitation"]

[[test]]
name = "shadow_ir_compare"
required-features = ["shadow"]

[[test]]
name = "shadow_pair_gaps"
required-features = ["elicitation"]

[[test]]
name = "architecture"
required-features = ["rustdoc"]

[[test]]
name = "wrapper_ir"
required-features = ["impl_coverage"]

[[test]]
name = "wrapper_coverage_gaps"
required-features = ["impl_coverage"]

[[test]]
name = "feature_probe_gaps"
required-features = ["impl_coverage"]

[[test]]
name = "proof_harness_collect"
required-features = ["impl_coverage"]

[[test]]
name = "path_index"
required-features = ["impl_coverage"]

[[test]]
name = "rustdoc_structure_enricher"
required-features = ["rustdoc"]

[[test]]
name = "impl_graph_enrichers"
required-features = ["impl_coverage"]

[[test]]
name = "syn_doc_link"
required-features = ["rustdoc"]

[dev-dependencies]
tempfile = "3"
rustdoc-types = "0.57"
miette = { version = "7", features = ["fancy"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(kani)',
  'cfg(creusot)',
  'cfg(prusti)',
  'cfg(verus)',
  'cfg(feature, values("panics", "tracing", "cli", "allows", "modularity", "derives", "error_sites", "error_chain", "internal_error_chain", "foreign_error_types", "foreign_error_attenuation", "antipatterns", "cfg_scatter", "cfg_hygiene", "visibility", "cli_layout", "crate_attrs", "doc_warnings", "glob_imports", "inline_tests", "verus_warnings", "verus_ir", "proof_patterns", "pageantry", "quality", "rustdoc", "impl_coverage", "trenchcoat", "shadow", "elicitation", "homecoming_std", "amenable_std", "full"))',
] }
