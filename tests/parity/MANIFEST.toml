//! elicit_doc output parity baselines.
//!
//! Generated with `elicit_doc quality {panics,tracing}` against the matching
//! workspace under `workspaces/`. Re-freeze after changing fixtures or
//! bumping the pinned elicit_doc revision below.

elicit_doc_rev = "96a4ad4"
cordial_parity_phase = "P2"

[[workspace]]
name = "panic_sources"
path = "workspaces/panic_sources"
elicit_doc_commands = [
  "quality panics",
  "quality tracing",
]

[[workspace]]
name = "simple_fn"
path = "workspaces/simple_fn"
elicit_doc_commands = [
  "quality panics",
  "quality tracing",
]

[[workspace]]
name = "mixed_visibilities"
path = "workspaces/mixed_visibilities"
elicit_doc_commands = [
  "quality panics",
  "quality tracing",
]

# Tracing rows where `private_fn` is public visibility but named for the fixture;
# cordial and elicit_doc both report three open instrument gaps here.

[[workspace]]
name = "error_sites"
path = "workspaces/error_sites"
elicit_doc_commands = [
  "quality error_sites",
  "quality foreign_error_types",
]

[[workspace]]
name = "error_chain"
path = "workspaces/error_chain"
elicit_doc_commands = [
  "quality error_chain",
  "quality foreign_error_attenuation",
]
