[package]
name = "cordial_amenable"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/crumplecup/cordial"
description = "Amenable std coverage profile for cordial"
publish = false

[features]
default = ["amenable_std"]
amenable_std = ["cordial/amenable_std"]

[dependencies]
cordial = { path = "..", default-features = false, features = ["amenable_std"] }
