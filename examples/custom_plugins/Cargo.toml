[package]
name = "cordial_custom_plugins"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
publish = false
description = "Downstream example: three plugin kinds a third-party crate can register"

[dependencies]
cordial = { path = "../..", default-features = false, features = ["quality", "impl_coverage"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }

[dev-dependencies]
tempfile = "3"
miette = { version = "7", features = ["fancy"] }
