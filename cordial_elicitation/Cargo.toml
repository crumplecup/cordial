[package]
name = "cordial_elicitation"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/crumplecup/cordial"
description = "Elicitation-specific cordial etiquettes — future home for elicit_doc coverage bundles"
publish = false

[features]
default = ["elicitation"]
# Enables cordial's elicitation coverage plugins (impl coverage, trenchcoat, shadow).
elicitation = ["cordial/elicitation"]

[dependencies]
cordial = { path = "..", default-features = false, features = ["elicitation"] }

[dev-dependencies]
tempfile = "3"
miette = { version = "7", features = ["fancy"] }

[[test]]
name = "plugin_registry"
required-features = ["elicitation"]
